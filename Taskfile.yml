# =============================================================================
# Helios Platform - Root Taskfile
# =============================================================================
# Usage:
#   task check          Verify all prerequisites are installed
#   task setup          Bootstrap the full local environment (cluster + deps)
#   task dev            Run operator + portal concurrently
#   task test           Run all tests
#   task clean          Tear down the k3d cluster
#
# First-time setup:
#   cp .env.example .env   # fill in your credentials
#   task check             # make sure every tools are installed and .env is configured
#   task setup             # ~5-10 minutes
#   task dev               # opens operator + portal
#
# Cross-platform:
#   Linux/macOS: works natively
#   Windows:     requires Git Bash or WSL (for bash-based sub-scripts)
# =============================================================================
version: "3"

dotenv: [".env"]

vars:
  CLUSTER_NAME: helios-dev
  ARGOCD_PORT: "8080"
  KUBECTL_PROXY_PORT: "8001"
  GITEA_PORT: "3030"
  GITEA_INTERNAL_HOST: gitea-http.gitea.svc.cluster.local:3000
  GITOPS_SECRET_NAME: helios-gitops-bot
  # Local pull-through cache registry — persists across task clean cycles
  REGISTRY_NAME: helios-registry
  REGISTRY_PORT: "5001"
  # Cap Tekton resource usage during local builds/tests to avoid host lockups.
  TEKTON_LIMIT_NAMESPACE: default
  TEKTON_LIMIT_CPU: "2"
  TEKTON_LIMIT_MEMORY: 2Gi
  TEKTON_LIMIT_REQUEST_CPU: "500m"
  TEKTON_LIMIT_REQUEST_MEMORY: 512Mi

set: [errexit, pipefail]

# =============================================================================
# Prerequisite Checking
# =============================================================================
tasks:
  # ===========================================================================
  # Workflow Shortcuts
  # ===========================================================================
  default:
    desc: Show common commands
    cmds:
      - task: help

  help:
    desc: Print recommended workflows
    silent: true
    cmds:
      - echo ""
      - echo "Helios common workflows:"
      - echo "  task check                        Verify prerequisites"
      - echo "  task setup                        First-time bootstrap (cluster + deps)"
      - echo "  task dev                          Run operator + portal"
      - echo "  task dev:refresh APP=name(s)      Reset generated state then run dev"
      - echo "  task test                         Run operator + portal tests"
      - echo "  task clean                        Destroy cluster (keeps registry cache)"
      - echo ""
      - echo "Useful targeted commands:"
      - echo "  task setup:terraform              Recreate cluster/apps from Terraform"
      - echo "  task reset:generated APP=name(s)  Remove generated runtime state"
      - echo "  task reset:gitea-repo APP=name(s) Delete generated Gitea repos"
      - echo "  task clean:registry               Remove local registry cache"
      - echo ""
      - echo "APP=name(s) can be a single app, comma-separated (APP=app1,app2), or"
      - echo "'all' to discover and reset every generated app."
      - echo ""
      - echo "See 'task help:all' for the full task list."

  help:all:
    desc: Print all available tasks with descriptions
    cmds:
      - task --list-all

  check:
    desc: Verify all development prerequisites are installed and .env is configured
    cmds:
      - task: check:env
      - task: check:tools

  check:tools:
    desc: Verify all development prerequisites are installed
    cmds:
      - cmd: bash scripts/check-prereqs.sh
        platforms: [linux, darwin]
      - cmd: cmd /c scripts\\check-prereqs.bat
        platforms: [windows]

  check:env:
    desc: Verify prerequisites and .env configuration
    cmds:
      - cmd: bash scripts/check-prereqs.sh --env
        platforms: [linux, darwin]
      - cmd: cmd /c scripts\\check-prereqs.bat --env
        platforms: [windows]

  # ===========================================================================
  # Setup Tasks
  # ===========================================================================
  setup:
    desc: Bootstrap the full local development environment using Terraform
    deps: [check:env]
    cmds:
      - task: setup:all
      - echo ""
      - echo "============================================="
      - echo "  Helios local environment is ready!"
      - echo "  Gitea is available at http://localhost:{{.GITEA_PORT}}"
      - echo "  Registry cache at localhost:{{.REGISTRY_PORT}} (persists across clean)"
      - echo "  Run 'task dev' to start developing."
      - echo "============================================="

  setup:all:
    desc: Run full setup sequence (registry + infra + tekton + portal deps)
    cmds:
      - task: setup:registry
      - task: setup:terraform
      - task: setup:tekton
      - task: setup:portal-deps

  setup:registry:
    desc: Create a persistent local pull-through cache registry (survives task clean)
    cmds:
      - cmd: |
          REGISTRY_NAME="{{.REGISTRY_NAME}}"
          REGISTRY_PORT="{{.REGISTRY_PORT}}"

          if k3d registry list "k3d-${REGISTRY_NAME}" > /dev/null 2>&1; then
            echo "Registry 'k3d-${REGISTRY_NAME}' already exists on port ${REGISTRY_PORT}. Skipping."
          else
            echo "Creating local pull-through cache registry 'k3d-${REGISTRY_NAME}' on port ${REGISTRY_PORT}..."
            k3d registry create "${REGISTRY_NAME}" \
              --port "${REGISTRY_PORT}" \
              --proxy-remote-url "https://registry-1.docker.io" \
              --proxy-username "${DOCKER_USERNAME:-}" \
              --proxy-password "${DOCKER_TOKEN:-}"
            echo "Registry created. Docker Hub pulls will now be cached locally."
          fi
        platforms: [linux, darwin]

  setup:terraform:
    desc: Bootstrap the local environment (cluster + apps) using Terraform
    dir: infrastructure/environments/local-dev
    cmds:
      - |
        echo "Ensuring k3d cluster '{{.CLUSTER_NAME}}' exists..."
        mkdir -p ~/.kube
        touch ~/.kube/config
        if ! k3d cluster list {{.CLUSTER_NAME}} > /dev/null 2>&1; then
          echo "Creating k3d cluster '{{.CLUSTER_NAME}}'..."
          # Render the registry mirror config from the committed template
          mkdir -p ~/.k3d
          sed \
            -e "s/REGISTRY_NAME/{{.REGISTRY_NAME}}/g" \
            -e "s/REGISTRY_PORT/{{.REGISTRY_PORT}}/g" \
            "$(pwd)/../../modules/cluster-k3d/registries.yaml.tpl" \
            > ~/.k3d/helios-registries.yaml
          k3d cluster create {{.CLUSTER_NAME}} \
            --image rancher/k3s:v1.36.1-k3s1 \
            --agents 1 \
            --wait \
            --api-port 127.0.0.1:6550 \
            --k3s-arg "--disable=traefik@server:0" \
            --k3s-arg "--disable=metrics-server@server:0" \
            --registry-use "k3d-{{.REGISTRY_NAME}}:{{.REGISTRY_PORT}}" \
            --registry-config ~/.k3d/helios-registries.yaml
        fi
        echo "Merging kubeconfig context..."
        k3d kubeconfig merge {{.CLUSTER_NAME}} -d -s > /dev/null 2>&1 || true
      - terraform init
      - cmd: |
          STATE_LIST="$(terraform state list 2>/dev/null || true)"
          GITEA_IN_STATE="false"
          if echo "$STATE_LIST" | grep -q "module.gitea.helm_release.gitea"; then
            GITEA_IN_STATE="true"
          fi

          GITEA_RELEASE_EXISTS="false"
          if helm status gitea -n gitea >/dev/null 2>&1; then
            GITEA_RELEASE_EXISTS="true"
          fi

          # If a previous Gitea Helm release exists but isn't in Terraform state,
          # try to import it to avoid slow re-installs.
          if [ "$GITEA_RELEASE_EXISTS" = "true" ] && [ "$GITEA_IN_STATE" = "false" ]; then
            echo "Found existing Gitea Helm release not tracked by Terraform. Importing..."
            if terraform import module.gitea.helm_release.gitea gitea/gitea >/dev/null 2>&1 || \
               terraform import module.gitea.helm_release.gitea gitea >/dev/null 2>&1; then
              echo "Imported Gitea Helm release into Terraform state."
              if kubectl -n argocd get secret gitea-repo-creds >/dev/null 2>&1; then
                terraform import module.gitea.kubernetes_secret_v1.gitea_repo_creds argocd/gitea-repo-creds >/dev/null 2>&1 || true
              fi
              if kubectl -n default get secret helios-gitops-bot >/dev/null 2>&1; then
                terraform import module.gitea.kubernetes_secret_v1.gitea_gitops_secret default/helios-gitops-bot >/dev/null 2>&1 || true
              fi
            else
              echo "Import failed; uninstalling Gitea release to allow Terraform to recreate."
              helm uninstall gitea -n gitea || true
              GITEA_RELEASE_EXISTS="false"
            fi
          fi

          GITEA_CONFIGURE_FLAG="${GITEA_CONFIGURE:-}"
          if [ -z "$GITEA_CONFIGURE_FLAG" ]; then
            GITEA_READY="false"
            if kubectl -n gitea get deployment/gitea >/dev/null 2>&1; then
              if kubectl -n gitea rollout status deployment/gitea --timeout=5s >/dev/null 2>&1; then
                GITEA_READY="true"
              fi
            fi

            if [ -n "${GITEA_TOKEN:-}" ] && [ "$GITEA_READY" = "true" ]; then
              GITEA_CONFIGURE_FLAG="false"
            else
              GITEA_CONFIGURE_FLAG="true"
            fi
          fi

          terraform apply -auto-approve \
            -var="docker_username=${DOCKER_USERNAME:-}" \
            -var="docker_password=${DOCKER_TOKEN:-}" \
            -var="gitea_configure=${GITEA_CONFIGURE_FLAG}"

  setup:cluster:
    desc: Create a k3d cluster (idempotent)
    status:
      - k3d kubeconfig get {{.CLUSTER_NAME}}
    cmds:
      - echo "Creating k3d cluster '{{.CLUSTER_NAME}}'..."
      - k3d cluster create {{.CLUSTER_NAME}} --image rancher/k3s:v1.36.1-k3s1 --agents 1 --wait --api-port 127.0.0.1:6550 --k3s-arg "--disable=traefik@server:0"
      - kubectl config set-cluster k3d-{{.CLUSTER_NAME}} --server=https://localhost:6550
      - kubectl cluster-info

  setup:coredns:
    desc: Patch CoreDNS to use robust external DNS servers instead of k3d node's resolv.conf
    cmds:
      - echo "Patching CoreDNS to use 8.8.8.8 and 1.1.1.1..."
      - cmd: |
          kubectl get configmap coredns -n kube-system -o yaml > coredns.yaml
          sed 's/forward . \/etc\/resolv.conf/forward . 8.8.8.8 1.1.1.1/' coredns.yaml > coredns-patched.yaml
          kubectl apply -f coredns-patched.yaml
          rm coredns.yaml coredns-patched.yaml
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "$coredns = kubectl get configmap coredns -n kube-system -o yaml; $coredns = $coredns -replace 'forward \. /etc/resolv\.conf', 'forward . 8.8.8.8 1.1.1.1'; $coredns | Out-File -Encoding utf8 coredns.yaml; kubectl apply -f coredns.yaml; Remove-Item coredns.yaml"
        platforms: [windows]
      - kubectl rollout restart -n kube-system deployment/coredns

  setup:tekton:
    desc: Install Tekton Pipeline, Triggers, and Interceptors
    status:
      - kubectl get namespace tekton-pipelines
      - kubectl get deployment/tekton-triggers-controller -n tekton-pipelines
      - kubectl get deployment/tekton-triggers-webhook -n tekton-pipelines
    cmds:
      - echo "Waiting for ArgoCD to deploy Tekton Pipelines..."
      - cmd: |
          for i in {1..120}; do
            if kubectl get deployment/tekton-pipelines-controller -n tekton-pipelines >/dev/null 2>&1; then
              echo "Tekton Pipelines controller deployment found."
              exit 0
            fi
            echo "Waiting for deployment to be created..."
            sleep 5
          done
          echo "Timeout waiting for Tekton Pipelines deployment"
          exit 1
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "for ($i=1; $i -le 120; $i++) { if (kubectl get deployment/tekton-pipelines-controller -n tekton-pipelines 2>$null) { echo 'Tekton Pipelines controller deployment found.'; exit 0 }; echo 'Waiting for deployment to be created...'; Start-Sleep -Seconds 5 }; echo 'Timeout waiting for Tekton Pipelines deployment'; exit 1"
        platforms: [windows]
      - echo "Installing Tekton Triggers..."
      - kubectl apply --filename https://storage.googleapis.com/tekton-releases/triggers/latest/release.yaml --request-timeout=120s
      - echo "Installing Tekton Interceptors..."
      - kubectl apply --filename https://storage.googleapis.com/tekton-releases/triggers/latest/interceptors.yaml --request-timeout=120s
      - echo "Waiting for Tekton Pipelines controller..."
      - kubectl rollout status deployment/tekton-pipelines-controller -n tekton-pipelines --timeout=600s
      - echo "Waiting for Tekton Pipelines webhook..."
      - kubectl rollout status deployment/tekton-pipelines-webhook -n tekton-pipelines --timeout=600s
      - echo "Ensuring Tekton webhook deployment is still healthy..."
      - cmd: kubectl rollout status deployment/tekton-pipelines-webhook -n tekton-pipelines --timeout=120s
        platforms: [linux, darwin]
      - cmd: kubectl rollout status deployment/tekton-pipelines-webhook -n tekton-pipelines --timeout=120s
        platforms: [windows]
      - echo "Patching Tekton feature flags..."
      - >-
        kubectl patch configmap feature-flags -n tekton-pipelines
        -p '{"data":{"disable-affinity-assistant":"true","coschedule":"disabled"}}'
      - kubectl rollout restart deployment tekton-pipelines-controller -n tekton-pipelines
      - kubectl rollout status deployment/tekton-pipelines-controller -n tekton-pipelines --timeout=600s
      - echo "Applying LimitRange to cap Tekton build resources..."
      - cmd: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: tekton-resource-limits
            namespace: {{.TEKTON_LIMIT_NAMESPACE}}
          spec:
            limits:
              - type: Container
                default:
                  memory: {{.TEKTON_LIMIT_MEMORY}}
                  cpu: "{{.TEKTON_LIMIT_CPU}}"
                defaultRequest:
                  memory: {{.TEKTON_LIMIT_REQUEST_MEMORY}}
                  cpu: "{{.TEKTON_LIMIT_REQUEST_CPU}}"
          EOF

  setup:tekton-pruner:
    desc: Install Tekton Pruner to clean old PipelineRuns/TaskRuns
    status:
      - kubectl get deployment/tekton-pruner-controller -n tekton-pipelines
      - kubectl get configmap/tekton-pruner-default-spec -n tekton-pipelines
    cmds:
      - echo "Installing Tekton Pruner..."
      - kubectl apply -f "https://infra.tekton.dev/tekton-releases/pruner/previous/v0.3.3/release.yaml"
      - echo "Waiting for Tekton Pruner deployments..."
      - kubectl rollout status deployment/tekton-pruner-controller -n tekton-pipelines --timeout=300s
      - kubectl rollout status deployment/tekton-pruner-webhook -n tekton-pipelines --timeout=300s
      - echo "Ensuring Tekton pruner webhook deployment is still healthy..."
      - cmd: kubectl rollout status deployment/tekton-pruner-webhook -n tekton-pipelines --timeout=120s
        platforms: [linux, darwin]
      - cmd: kubectl rollout status deployment/tekton-pruner-webhook -n tekton-pipelines --timeout=120s
        platforms: [windows]
      - echo "Configuring Tekton Pruner (global TTL)..."
      - cmd: |
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tekton-pruner-default-spec
            namespace: tekton-pipelines
            labels:
              app.kubernetes.io/part-of: tekton-pruner
              pruner.tekton.dev/config-type: global
          data:
            global-config: |
              enforcedConfigLevel: global
              ttlSecondsAfterFinished: 7200
              successfulHistoryLimit: 3
              failedHistoryLimit: 3
          EOF
      - echo "Waiting for Tekton Pruner controller..."
      - kubectl wait --for=condition=Ready pod -l app=tekton-pruner-controller -n tekton-pipelines --timeout=180s

  setup:argocd:
    desc: Install ArgoCD
    status:
      - kubectl get namespace argocd
      - kubectl get deployment/argocd-server -n argocd
      - kubectl get deployment/argocd-repo-server -n argocd
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - echo "Installing ArgoCD..."
      - kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      # Repo-server often needs several minutes on first install (image pull + scheduling).
      # Use the same budget as rollout status below; 180s is too easy to hit on k3d/minikube.
      - echo "Waiting for ArgoCD components to be created..."
      - cmd: kubectl wait --for=condition=Available deployment/argocd-repo-server -n argocd --timeout=600s
        platforms: [linux, darwin]
      - cmd: kubectl wait --for=condition=Available deployment/argocd-repo-server -n argocd --timeout=600s
        platforms: [windows]
      - echo "Waiting for ArgoCD API server..."
      - kubectl rollout status deployment/argocd-server -n argocd --timeout=600s
      - echo "Waiting for ArgoCD repo server..."
      - kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=600s
      - echo "Waiting for ArgoCD application controller..."
      - kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=600s

  setup:gitea:
    desc: Install Gitea (lightweight Git server) with SQLite
    status:
      - kubectl get namespace gitea
      - kubectl get deployment/gitea -n gitea
    cmds:
      - echo "Installing Gitea via Helm (SQLite, minimal resources)..."
      - cmd: >-
          helm install gitea oci://registry-1.docker.io/giteacharts/gitea
          --namespace gitea --create-namespace
          --set gitea.admin.username=${GITEA_ADMIN_USER:-helios}
          --set gitea.admin.password=${GITEA_ADMIN_PASS:-helios123}
          --set postgresql.enabled=false
          --set postgresql-ha.enabled=false
          --set redis-cluster.enabled=false
          --set redis.enabled=false
          --set valkey-cluster.enabled=false
          --set valkey.enabled=false
          --set gitea.config.database.DB_TYPE=sqlite3
          --set gitea.config.session.PROVIDER=memory
          --set gitea.config.cache.ADAPTER=memory
          --set gitea.config.queue.TYPE=level
          --set gitea.config.server.ROOT_URL=http://localhost:{{.GITEA_PORT}}
          --set gitea.config.server.HTTP_PORT=3000
          --set gitea.config.webhook.ALLOWED_HOST_LIST=*
          --set persistence.size=1Gi
          --set resources.requests.memory=128Mi
          --set resources.limits.memory=256Mi
      - echo "Waiting for Gitea deployment..."
      - kubectl rollout status deployment/gitea -n gitea --timeout=300s

  setup:gitea-token:
    desc: Create Gitea API token, default org, and write to .env
    cmds:
      - echo "Configuring Gitea (Cross-platform)..."
      - cmd: |
          echo "Port-forwarding Gitea for setup..."
          kubectl port-forward -n gitea svc/gitea-http {{.GITEA_PORT}}:3000 &
          PF_PID=$!
          sleep 3

          GITEA_ADMIN_USER="${GITEA_ADMIN_USER:-helios}"
          GITEA_ADMIN_PASS="${GITEA_ADMIN_PASS:-helios123}"
          GITEA_BASE="http://localhost:{{.GITEA_PORT}}"

          echo "Creating Gitea organization 'helios'..."
          curl -s -X POST "$GITEA_BASE/api/v1/orgs" \
            -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASS" \
            -H "Content-Type: application/json" \
            -d '{"username":"helios-platform", "full_name":"Helios Platform", "visibility":"public"}' || true

          echo "Creating Gitea API token..."
          TOKEN_RESP=$(curl -s -X POST "$GITEA_BASE/api/v1/users/$GITEA_ADMIN_USER/tokens" \
            -u "$GITEA_ADMIN_USER:$GITEA_ADMIN_PASS" \
            -H "Content-Type: application/json" \
            -d '{"name":"helios-platform-'"$(date +%s)"'","scopes":["all"]}')

          TOKEN=$(echo "$TOKEN_RESP" | jq -r '.sha1 // .token // empty')

          if [ -z "$TOKEN" ]; then
            echo "Warning: Could not extract token. You may need to create one manually."
            echo "Response was: $TOKEN_RESP"
          else
            ENV_FILE=".env"
            PORTAL_ENV="apps/portal/.env"
            GITEA_URL="http://localhost:{{.GITEA_PORT}}"
            GITEA_INTERNAL_URL="http://gitea-http.gitea.svc.cluster.local:3000"

            update_env_var() {
              local file="$1" key="$2" val="$3"
              if [ ! -f "$file" ]; then touch "$file"; fi
              if grep -q "^${key}=" "$file" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$file"
              else
                echo "${key}=${val}" >> "$file"
              fi
            }

            for f in "$ENV_FILE" "$PORTAL_ENV"; do
              update_env_var "$f" "GITEA_TOKEN"        "$TOKEN"
              update_env_var "$f" "GITEA_USER"         "$GITEA_ADMIN_USER"
              update_env_var "$f" "GITEA_URL"          "$GITEA_URL"
              update_env_var "$f" "GITEA_INTERNAL_URL" "$GITEA_INTERNAL_URL"
            done

            echo ""
            echo "============================================="
            echo "  Gitea API token created and saved!"
            echo "  Updated: $ENV_FILE, $PORTAL_ENV"
            echo "  GITEA_TOKEN=$TOKEN"
            echo "============================================="
          fi

          kill $PF_PID 2>/dev/null || true
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/config-gitea.ps1 -GiteaPort {{.GITEA_PORT}}
        platforms: [windows]

  setup:argocd-gitea:
    desc: Register Gitea repository credentials with ArgoCD
    cmds:
      - echo "Configuring ArgoCD to access Gitea repos..."
      - cmd: |
          GITEA_ADMIN_USER="${GITEA_ADMIN_USER:-helios}"
          GITEA_ADMIN_PASS="${GITEA_ADMIN_PASS:-helios123}"

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitea-repo-creds
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          stringData:
            type: git
            url: http://{{.GITEA_INTERNAL_HOST}}
            username: "$GITEA_ADMIN_USER"
            password: "$GITEA_ADMIN_PASS"
          EOF
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/setup-argocd-creds.ps1 -GiteaInternalHost {{.GITEA_INTERNAL_HOST}}
        platforms: [windows]
      - echo "ArgoCD can now access Gitea repositories."

  setup:gitea-gitops-secret:
    desc: Create/refresh Tekton GitOps credentials secret (dedicated bot preferred)
    cmds:
      - echo "Creating Tekton GitOps credentials secret '{{.GITOPS_SECRET_NAME}}' in namespace default..."
      - cmd: |
          GITOPS_GIT_USER="${GITOPS_GIT_USER:-${GITEA_BOT_USER:-${GITEA_ADMIN_USER:-helios}}}"
          GITOPS_GIT_PASSWORD="${GITOPS_GIT_PASSWORD:-${GITEA_BOT_PASSWORD:-${GITEA_ADMIN_PASS:-helios123}}}"
          GITOPS_SECRET_NAME="{{.GITOPS_SECRET_NAME}}"

          kubectl create secret generic "$GITOPS_SECRET_NAME" \
            --type=kubernetes.io/basic-auth \
            --from-literal=username="$GITOPS_GIT_USER" \
            --from-literal=password="$GITOPS_GIT_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl annotate secret "$GITOPS_SECRET_NAME" \
            tekton.dev/git-0=http://{{.GITEA_INTERNAL_HOST}} \
            --overwrite

          ENV_FILE=".env"
          PORTAL_ENV="apps/portal/.env"
          update_env_var() {
            local file="$1" key="$2" val="$3"
            if [ ! -f "$file" ]; then touch "$file"; fi
            if grep -q "^${key}=" "$file" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$file"
            else
              echo "${key}=${val}" >> "$file"
            fi
          }
          for f in "$ENV_FILE" "$PORTAL_ENV"; do
            update_env_var "$f" "GITOPS_SECRET_REF" "$GITOPS_SECRET_NAME"
          done
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/setup-gitops-creds.ps1 -GiteaInternalHost {{.GITEA_INTERNAL_HOST}} -SecretName {{.GITOPS_SECRET_NAME}}
        platforms: [windows]
      - echo "Created secret '{{.GITOPS_SECRET_NAME}}' and wrote GITOPS_SECRET_REF to .env files."

  setup:crds:
    desc: Install Helios CRDs into the cluster
    dir: apps/operator
    status:
      - kubectl get crd heliosapps.app.helios.io
    cmds:
      - cmd: make install
        platforms: [linux, darwin]
      - cmd: kubectl kustomize config/crd | kubectl apply -f -
        platforms: [windows]

  setup:tekton-rbac:
    desc: Grant Tekton Triggers SA the permissions to create PipelineRuns
    status:
      - kubectl get role tekton-triggers-pipelinerun-runner --namespace default
      - kubectl get rolebinding tekton-triggers-pipelinerun-runner --namespace default
    cmds:
      - >-
        kubectl create role tekton-triggers-pipelinerun-runner
        --namespace default
        --verb=get,list,watch,create,update,patch
        --resource=pipelineruns.tekton.dev,taskruns.tekton.dev
        --dry-run=client -o yaml | kubectl apply -f -
      - >-
        kubectl create rolebinding tekton-triggers-pipelinerun-runner
        --namespace default
        --role=tekton-triggers-pipelinerun-runner
        --serviceaccount=default:tekton-triggers-sa
        --dry-run=client -o yaml | kubectl apply -f -

  setup:credentials:
    desc: Create Docker registry secret and link to pipeline SA
    cmds:
      - cmd: |
          if [ -z "$DOCKER_USERNAME" ] || { [ -z "$DOCKER_TOKEN" ] && [ -z "$DOCKER_PASSWORD" ]; }; then
            echo "DOCKER_USERNAME and either DOCKER_TOKEN or DOCKER_PASSWORD must be set in .env" >&2
            exit 1
          fi
        platforms: [linux, darwin]
      - cmd: |
          DOCKER_SERVER="${DOCKER_SERVER:-https://index.docker.io/v1/}"
          DOCKER_SECRET_PASS="${DOCKER_TOKEN:-$DOCKER_PASSWORD}"

          kubectl create secret docker-registry docker-credentials \
            --docker-server="$DOCKER_SERVER" \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_SECRET_PASS" \
            --dry-run=client -o yaml | kubectl apply -f -
        platforms: [linux, darwin]
      - cmd: |
          if kubectl get sa pipeline >/dev/null 2>&1; then
            kubectl patch sa pipeline -p '{"secrets": [{"name": "docker-credentials"}]}'
          else
            echo "pipeline ServiceAccount not found yet; skipping patch (will be created by Tekton)"
          fi
          kubectl patch sa default -p '{"imagePullSecrets": [{"name": "docker-credentials"}]}'
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/setup-credentials.ps1
        platforms: [windows]

  setup:portal-deps:
    desc: Install Backstage portal dependencies
    dir: apps/portal
    cmds:
      - yarn install

  # ===========================================================================
  # Development Tasks
  # ===========================================================================
  dev:
    desc: Run operator and portal concurrently
    deps: [dev:operator, dev:portal]

  dev:operator:
    desc: Run the Helios operator locally
    dir: apps/operator
    env:
      HELIOS_CUE_PATH: "{{.ROOT_DIR}}/cue"
    cmds:
      - cmd: make run
        platforms: [linux, darwin]
      - cmd: go run ./cmd/main.go
        platforms: [windows]

  dev:portal:
    desc: Run the Backstage portal with ArgoCD + kubectl proxy
    dir: apps/portal
    cmds:
      - task: dev:free-ports
      - cmd: ./start-dev.sh
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -File ../../scripts/start-portal.ps1 -ArgocdPort {{.ARGOCD_PORT}}
        platforms: [windows]

  dev:free-ports:
    desc: Ensure common dev ports are free (override with PORTS=7007,8080,...)
    cmds:
      - cmd: |
          PORTS_RAW="{{.PORTS}}"
          if [ -z "$PORTS_RAW" ]; then
            PORTS_RAW="7007,8080,8001,3030"
          fi

          if ! command -v lsof >/dev/null 2>&1; then
            echo "lsof not found; skipping port cleanup on linux/darwin."
            exit 0
          fi

          PORTS=$(echo "$PORTS_RAW" | tr ',' ' ')
          for PORT in $PORTS; do
            PIDS="$(lsof -t -iTCP:${PORT} -sTCP:LISTEN || true)"
            if [ -n "$PIDS" ]; then
              echo "Port ${PORT} busy. Stopping process(es): $PIDS"
              for PID in $PIDS; do
                /bin/kill -9 "$PID" 2>/dev/null || command kill -9 "$PID" 2>/dev/null || true
              done
            fi
          done
          sleep 1
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "$portsRaw='{{.PORTS}}'; if ([string]::IsNullOrWhiteSpace($portsRaw)) { $portsRaw='7007,8080,8001,3030' }; $ports = $portsRaw -split '[,\s]+' | Where-Object { $_ -ne '' }; foreach ($port in $ports) { $connections = Get-NetTCPConnection -LocalPort ([int]$port) -State Listen -ErrorAction SilentlyContinue; if ($connections) { $pids = $connections | Select-Object -ExpandProperty OwningProcess -Unique; Write-Host ('Port ' + $port + ' busy. Stopping process(es): ' + ($pids -join ', ')); foreach ($pid in $pids) { Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue } } }"
        platforms: [windows]

  dev:refresh:
    desc: Reset generated state (APP optional) then run dev
    cmds:
      - task: reset:generated
        vars:
          APP: "{{.APP}}"
      - task: dev

  # ===========================================================================
  # Fast Reset Tasks (without recreating cluster)
  # ===========================================================================
  reset:generated:
    desc: "Remove generated state (APP optional — single, comma-sep, or all)"
    cmds:
      - task: reset:k8s
      - task: reset:tekton-runs
      - cmd: |
          APPS_RAW="{{.APP}}"
          if [ -z "$APPS_RAW" ]; then
            echo "APP is empty, skipping repo cleanup. Use: task reset:generated APP=<repo-name>"
            echo "  Single:   APP=nestjs-prisma"
            echo "  Multiple: APP=nestjs-prisma,express-api"
            echo "  All:      APP=all"
            exit 0
          fi

          if [ "$APPS_RAW" = "all" ]; then
            task reset:gitea-repo APP="all"
            task reset:portal-db
            # Clean DB state from any remaining k8s secrets
            APPS=$(kubectl get secrets -n default -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | sed -n 's/-db-secret$//p' | sort -u)
            for a in $APPS; do
              task reset:db-state APP="$a"
            done
          else
            OLD_IFS="$IFS"; IFS=','
            for a in $APPS_RAW; do
              IFS="$OLD_IFS"
              a="$(echo "$a" | xargs)"
              [ -z "$a" ] && continue
              task reset:db-state APP="$a"
              task reset:gitea-repo APP="$a"
              # Clean from Backstage Catalog
              curl -s -X DELETE "http://localhost:7007/api/catalog/entities/by-name/component/default/${a}" >/dev/null 2>&1 || true
            done
            IFS="$OLD_IFS"
          fi
        platforms: [linux, darwin]

  reset:k8s:
    desc: Delete generated Helios apps in cluster (keeps infra, ArgoCD, Tekton, Gitea)
    cmds:
      - cmd: |
          # Patch finalizers to empty to prevent hanging if operator is offline
          APPS_TO_PATCH=$(kubectl get heliosapp -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{" "}{end}' 2>/dev/null || true)
          for APP in $APPS_TO_PATCH; do
            if [ -n "$APP" ]; then
              NS=${APP%/*}
              NAME=${APP#*/}
              kubectl patch heliosapp "$NAME" -n "$NS" -p '{"metadata":{"finalizers":[]}}' --type=merge || true
            fi
          done
          kubectl delete heliosapp --all -A --ignore-not-found=true || true
          APPS=$(kubectl get application -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
          for APP_NAME in $APPS; do
            if [ "$APP_NAME" != "helios-bootstrap" ]; then
              kubectl delete application "$APP_NAME" -n argocd --ignore-not-found=true || true
            fi
          done
          kubectl delete deployment,statefulset,service,configmap,secret,pvc -n default -l helios.io/managed-by=operator --ignore-not-found=true || true
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "$heliosApps = kubectl get heliosapp -A -o jsonpath='{range .items[*]}{.metadata.namespace}{\" \"}{.metadata.name}{\"`n\"}{end}' 2>$null; foreach ($appLine in $heliosApps -split \"`n\") { if ($appLine) { $parts = $appLine -split ' '; if ($parts.Length -eq 2) { kubectl patch heliosapp $parts[1] -n $parts[0] -p '{\"metadata\":{\"finalizers\":[]}}' --type=merge } } }; kubectl delete heliosapp --all -A --ignore-not-found=true; $apps = kubectl get application -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{\"`n\"}{end}' 2>$null; foreach ($app in $apps -split \"`n\") { if ($app -and $app -ne 'helios-bootstrap') { kubectl delete application $app -n argocd --ignore-not-found=true } }; kubectl delete deployment,statefulset,service,configmap,secret,pvc -n default -l helios.io/managed-by=operator --ignore-not-found=true"
        platforms: [windows]

  reset:tekton-runs:
    desc: Delete all PipelineRuns and TaskRuns from local namespace
    cmds:
      - cmd: |
          kubectl delete pipelinerun --all -n default --ignore-not-found=true || true
          kubectl delete taskrun --all -n default --ignore-not-found=true || true
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "kubectl delete pipelinerun --all -n default --ignore-not-found=true; kubectl delete taskrun --all -n default --ignore-not-found=true"
        platforms: [windows]

  reset:db-state:
    desc: "Delete DB secrets/PVCs (APP: single, comma-sep, or all)"
    cmds:
      - cmd: |
          APP_RAW="{{.APP}}"
          if [ -z "$APP_RAW" ]; then
            echo "APP is required. Examples:"
            echo "  Single:   APP=nestjs-prisma"
            echo "  Multiple: APP=nestjs-prisma,express-api"
            echo "  All:      APP=all"
            exit 1
          fi

          if [ "$APP_RAW" = "all" ]; then
            APPS=$(kubectl get secrets -n default -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | sed -n 's/-db-secret$//p' | sort -u)
            if [ -z "$APPS" ]; then
              echo "No app database secrets found in default namespace."
              exit 0
            fi
          else
            APPS=$(echo "$APP_RAW" | tr ',' '\n')
          fi

          OLD_IFS="$IFS"; IFS="$(printf '\n ')"; set -f
          for a in $APPS; do
            set +f; IFS="$OLD_IFS"
            a="$(echo "$a" | xargs)"
            [ -z "$a" ] && continue
            echo "Cleaning DB state for: $a"
            kubectl delete secret "${a}-db-secret" -n default --ignore-not-found=true || true
            kubectl delete pvc "data-${a}-db-0" -n default --ignore-not-found=true || true
          done
          IFS="$OLD_IFS"; set +f
        platforms: [linux, darwin]
      - cmd: |
          powershell -ExecutionPolicy Bypass -Command "$app='{{.APP}}'; if (-not $app) { Write-Host 'APP is required. Example: task reset:db-state APP=nestjs-prisma'; exit 1 }; kubectl delete secret ($app + '-db-secret') -n default --ignore-not-found=true; kubectl delete pvc ('data-' + $app + '-db-0') -n default --ignore-not-found=true"
        platforms: [windows]

  reset:portal-db:
    desc: Reset the local persistent SQLite database of the Backstage portal
    cmds:
      - cmd: rm -rf apps/portal/packages/backend/.database
        platforms: [linux, darwin]
      - cmd: powershell -ExecutionPolicy Bypass -Command "Remove-Item -Recurse -Force -Path apps/portal/packages/backend/.database -ErrorAction SilentlyContinue"
        platforms: [windows]

  reset:gitea-repo:
    desc: "Delete Gitea repos (APP: single, comma-sep, or all)"
    cmds:
      - cmd: |
          APP_RAW="{{.APP}}"
          if [ -z "$APP_RAW" ]; then
            echo "APP is required. Examples:"
            echo "  Single:   APP=nestjs-prisma"
            echo "  Multiple: APP=nestjs-prisma,express-api"
            echo "  All:      APP=all"
            exit 1
          fi

          GITEA_BASE="${GITEA_URL:-http://localhost:{{.GITEA_PORT}}}"
          GITEA_USER="${GITEA_USER:-${GITEA_ADMIN_USER:-helios}}"
          GITEA_PASS="${GITEA_ADMIN_PASS:-helios123}"

          # If we are checking localhost, free port 3030 if occupied (avoiding stale kubectl port-forward issues)
          if [ "${GITEA_BASE}" = "http://localhost:3030" ] && command -v lsof >/dev/null 2>&1; then
            PIDS="$(lsof -t -iTCP:3030 -sTCP:LISTEN || true)"
            if [ -n "$PIDS" ]; then
              echo "Port 3030 busy before Gitea repo cleanup. Stopping stale process(es): $PIDS"
              for PID in $PIDS; do
                /bin/kill -9 "$PID" 2>/dev/null || command kill -9 "$PID" 2>/dev/null || true
              done
              sleep 1
            fi
          fi

          PF_PID=0
          # If Gitea is unreachable on localhost, try to start a temporary port-forward
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${GITEA_USER}:${GITEA_PASS}" \
            "${GITEA_BASE}/api/v1/version" || true)

          if [ "$HEALTH_CODE" = "000" ] || [ -z "$HEALTH_CODE" ]; then
            echo "Gitea unreachable on localhost. Attempting temporary port-forward..."
            kubectl port-forward -n gitea svc/gitea-http 3030:3000 >/dev/null 2>&1 &
            PF_PID=$!
            # Give it a few seconds to start
            for i in {1..10}; do
              if curl -s -o /dev/null -w "%{http_code}" "http://localhost:3030/api/v1/version" | grep -q "200"; then
                HEALTH_CODE="200"
                GITEA_BASE="http://localhost:3030"
                echo "Port-forward established."
                break
              fi
              sleep 1
            done
          fi

          if [ "$HEALTH_CODE" = "000" ] || [ -z "$HEALTH_CODE" ]; then
            [ $PF_PID -ne 0 ] && kill $PF_PID 2>/dev/null || true
            echo "Gitea is unreachable at ${GITEA_BASE}. Skipping repo cleanup."
            exit 0
          fi

          delete_repo() {
            REPO_FULL_NAME="$1"
            [ -z "$REPO_FULL_NAME" ] && return 0

            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -u "${GITEA_USER}:${GITEA_PASS}" \
              "${GITEA_BASE}/api/v1/repos/${REPO_FULL_NAME}" || true)
            if [ "$CODE" = "204" ]; then
              echo "Deleted: ${REPO_FULL_NAME}"
            fi
          }

          if [ "$APP_RAW" = "all" ]; then
            # Delete every repo visible to the authenticated user so a refresh
            # starts from a true clean slate, regardless of owner or org.
            REPOS_JSON=$(curl -s -u "${GITEA_USER}:${GITEA_PASS}" \
              "${GITEA_BASE}/api/v1/user/repos?limit=1000" 2>/dev/null || echo "[]")
            REPO_FULL_NAMES=$(echo "$REPOS_JSON" | grep -o '"full_name":"[^"]*"' | sed 's/"full_name":"//;s/"//' || true)
            for REPO_FULL_NAME in $REPO_FULL_NAMES; do
              delete_repo "$REPO_FULL_NAME"
            done
          else
            APPS=$(echo "$APP_RAW" | tr ',' '\n')
            OLD_IFS="$IFS"; IFS="$(printf '\n ')"; set -f
            for a in $APPS; do
              set +f; IFS="$OLD_IFS"
              a="$(echo "$a" | xargs)"
              [ -z "$a" ] && continue
              CANDIDATES="$a ${a}-gitops"
              for REPO in $CANDIDATES; do
                for OWNER in "$GITEA_USER" "helios-platform"; do
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X DELETE \
                    -u "${GITEA_USER}:${GITEA_PASS}" \
                    "${GITEA_BASE}/api/v1/repos/${OWNER}/${REPO}" || true)
                  if [ "$CODE" = "204" ]; then
                    echo "Deleted: ${OWNER}/${REPO}"
                  fi
                done
              done
            done
            IFS="$OLD_IFS"; set +f
          fi

          [ $PF_PID -ne 0 ] && kill $PF_PID 2>/dev/null || true
        platforms: [linux, darwin]

  # ===========================================================================
  # Testing Tasks
  # ===========================================================================
  test:
    desc: Run all tests
    cmds:
      - task: test:operator
      - task: test:portal

  test:operator:
    desc: Run operator unit tests
    dir: apps/operator
    cmds:
      - make test

  test:portal:
    desc: Run portal tests
    dir: apps/portal
    cmds:
      - yarn test --watchAll=false

  # ===========================================================================
  # Teardown Tasks
  # ===========================================================================
  clean:
    desc: Delete the k3d cluster and clean up (registry cache is preserved)
    cmds:
      - task: clean:cluster
      - task: reset:portal-db

  clean:all:
    desc: Delete the k3d cluster and all resources
    cmds:
      - task: clean:cluster
      - task: clean:registry

  clean:cluster:
    desc: Delete the k3d cluster and all resources using Terraform
    dir: infrastructure/environments/local-dev
    cmds:
      - cmd: |
          if [ ! -d ".terraform" ]; then
            echo "Terraform not initialized. Checking if cluster exists via k3d..."
            if k3d cluster list {{.CLUSTER_NAME}} >/dev/null 2>&1; then
              echo "Cluster '{{.CLUSTER_NAME}}' exists but Terraform is not initialized. Please run 'terraform init' or delete manually with 'k3d cluster delete {{.CLUSTER_NAME}}'."
              exit 1
            else
              echo "No cluster '{{.CLUSTER_NAME}}' found and Terraform is not initialized. Nothing to clean."
              exit 0
            fi
          fi

          if ! terraform state list >/dev/null 2>&1; then
             echo "Terraform state is empty. Checking if cluster exists via k3d..."
             if k3d cluster list {{.CLUSTER_NAME}} >/dev/null 2>&1; then
               echo "Cluster '{{.CLUSTER_NAME}}' exists but is not tracked by Terraform. Please delete manually with 'k3d cluster delete {{.CLUSTER_NAME}}'."
               exit 1
             else
               echo "No resources tracked by Terraform and no cluster '{{.CLUSTER_NAME}}' found. Nothing to clean."
               exit 0
             fi
          fi

          terraform destroy -refresh=false -auto-approve \
            -var="docker_username=${DOCKER_USERNAME:-}" \
            -var="docker_password=${DOCKER_TOKEN:-}"
          echo "Cluster '{{.CLUSTER_NAME}}' and all resources deleted."
        platforms: [linux, darwin]

  clean:registry:
    desc: Delete the local pull-through cache registry (also wipes its image cache)
    cmds:
      - cmd: |
          if k3d registry list "k3d-{{.REGISTRY_NAME}}" > /dev/null 2>&1; then
            echo "Deleting local registry 'k3d-{{.REGISTRY_NAME}}'..."
            k3d registry delete "k3d-{{.REGISTRY_NAME}}"
            echo "Registry deleted."
          else
            echo "Registry 'k3d-{{.REGISTRY_NAME}}' not found. Nothing to delete."
          fi
        platforms: [linux, darwin]
