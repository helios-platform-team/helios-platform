apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-boot-template
  title: Java Spring Boot Template
  description: Create a production-ready Java Spring Boot application (Gradle) integrated with a PostgreSQL database and automatic environment credential injection.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      description: >-
        We automatically configure your Git repository and Docker image locations using your local `.env` settings (`GITEA_USER` and `DOCKER_USERNAME`). No manual routing setup is required!
      required: [name]
      properties:
        name:
          title: Project Name
          type: string
          description: The unique name for your project. This will be used to name your Spring Boot application, code repository, and container image.
          ui:field: UniqueNamePicker
          ui:autofocus: true
        port:
          title: API Port
          type: number
          default: 8081
          ui:field: PortPicker
          description: The network port your Spring Boot API will serve traffic on.
        databaseConfig:
          title: Database Settings
          type: object
          description: Automatically provision and connect a PostgreSQL database to your Spring Boot application. Select 'None' if your API does not need a database.
          ui:field: DatabasePicker

  steps:
    - id: fetch-source
      name: Fetch Source Code
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.port }}
          description: "Spring Boot service: ${{ parameters.name }}"
          # DYNAMIC ROUTING: Uses Docker bridge variable
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dbPort: 5432

    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: Source Code for ${{ parameters.name }}
        # DYNAMIC ROUTING: Uses Git bridge variable
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    - id: create-webhook
      name: Create Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-listener.default.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}
        events:
          - push

    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          repoName: ${{ parameters.name }}
          port: ${{ parameters.port }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: "gradle test"
          testImage: "gradle:8.7-jdk21"

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: default
        # Uses the dynamic environment parameter instead of trying to parse a URL string
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}

    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}