apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: spring-boot-template
  title: Java Spring Boot Template (Database-backed)
  description: >-
    Scaffolds a standard Java Spring Boot application (Gradle) with a PostgreSQL database.
    The Helios Operator automatically provisions the database and injects
    credentials (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS) into the backend pod.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      required:
        - name
        - port
        - dockerOrg
        - repoName
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
        port:
          title: Port
          type: number
          description: The port the Spring Boot app listens on
          default: 8080
        dockerOrg:
          title: Docker Registry Org/User
          type: string
          description: Your Docker Hub username or Organization
        repoName:
          title: Docker Repository Name
          type: string
          description: The name of the Docker repository (e.g. my-service)

    - title: Database Configuration
      properties:
        databaseConfig:
          title: Database Settings
          type: object
          ui:field: DatabasePicker

    - title: Repository & Webhook
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Source Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - localhost:3030
    - title: Optional Extras (Local Convenience)
      properties:
        registerToCatalog:
          title: Register component in catalog
          type: boolean
          default: false
        sendNotification:
          title: Send Backstage notification
          type: boolean
          default: false

  steps:
    # 1. Source Code
    - id: fetch-source
      name: Fetch Source Code
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          # Use repoName as the app identifier to keep it Kubernetes/URL safe.
          name: ${{ parameters.repoName }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.port }}
          description: "Spring Boot service: ${{ parameters.name }}"
          image: index.docker.io/${{ parameters.dockerOrg }}/${{ parameters.repoName }}

    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: Source Code for ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./source
        repoVisibility: public

    - id: create-webhook
      name: Create Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ parameters.repoUrl }}
        # Tekton EventListener address is the service root.
        webhookUrl: http://el-${{ parameters.repoName }}-listener.default.svc.cluster.local:8080
        # Deterministic secret so users don't have to provide one.
        # Must match the Kubernetes secret value created below.
        webhookSecret: ${{ parameters.repoName }}
        events:
          - push

    # 2. GitOps
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.repoName }}
          image: index.docker.io/${{ parameters.dockerOrg }}/${{ parameters.repoName }}
          dockerOrg: ${{ parameters.dockerOrg }}
          repoName: ${{ parameters.repoName }}
          port: ${{ parameters.port }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: "gradle test"
          testImage: "gradle:8.7-jdk21"

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # 3. Secret + Deploy
    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.repoName }}
        namespace: default
        username: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
        webhookSecret: ${{ parameters.repoName }}

    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    # 4. Registration
    - id: register
      name: Register Component
      action: catalog:register
      if: '{{ parameters.registerToCatalog }}'
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    - id: notify
      name: Notify User
      action: notification:send
      if: '{{ parameters.sendNotification }}'
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: 'Spring Boot Template Executed'
        info: 'Your Spring Boot application has been scaffolded with a PostgreSQL database!'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
