# ──────────────────────────────────────────────────────────
# Application Configuration
# ──────────────────────────────────────────────────────────
spring:
  application:
    name: ${{ values.name }}

  # ── JPA / Hibernate ───────────────────────────────────
  jpa:
    # Validate schema against entities on startup; migrations
    # should be handled by Flyway / Liquibase in production.
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── DataSource ────────────────────────────────────────
  # Environment variables are injected by the Helios Operator
  # when deployed on Kubernetes.  For local development the
  # values fall back to sensible defaults that match the
  # docker-compose.yml shipped with this project.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${{ values.name | replace('-', '_') }}_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

# ── Server ──────────────────────────────────────────────
server:
  port: ${SERVER_PORT:${{ values.port }}}

# ── Actuator (health/readiness probes for Kubernetes) ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ── Logging ─────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.helios: DEBUG
    org.hibernate.SQL: WARN
