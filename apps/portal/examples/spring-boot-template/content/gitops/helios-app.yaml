apiVersion: app.helios.io/v1alpha1
kind: HeliosApp
metadata:
  name: ${{ values.name }}
  namespace: default
spec:
  owner: ${{ values.owner }}
  description: 'Spring Boot service: ${{ values.name }}'
  gitRepo: ${{ values.sourceRepo }}
  gitBranch: main
  imageRepo: ${{ values.dockerOrg }}/${{ values.repoName }}
  gitopsRepo: ${{ values.gitopsRepo }}
  gitopsPath: '.'
  pipelineName: from-code-to-cluster
  webhookSecret: ${{ values.name }}-git-credentials
  port: ${{ values.port }}
  testCommand: 'gradle test'
  components:
    - name: ${{ values.name }}
      type: web-service
      properties:
        image: ${{ values.dockerOrg }}/${{ values.repoName }}:main
        port: ${{ values.port }}
        replicas: 1
      traits:
        - type: service
          properties:
            port: ${{ values.port }}
        - type: database
          properties:
            dbType: ${{ values.databaseType | default("postgres") }}
            dbName: ${{ values.name | replace('-', '_') }}_db
            version: '18.4'
            storage: '1Gi'
