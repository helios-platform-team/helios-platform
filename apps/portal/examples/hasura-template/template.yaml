apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hasura-graphql-template
  title: Hasura GraphQL API Template
  description: Spin up a Hasura GraphQL Engine instance connected to a dynamically provisioned PostgreSQL database with automated connection string injection.
spec:
  owner: user:guest
  type: service

  # MINIMAL UI: Only requires Project Name and Database Selection
  parameters:
    - title: Component Information
      description: >-
        To satisfy dynamic portability, this template automatically maps repository and image registry destinations
        using your active workstation configuration (`GITEA_USER` and `DOCKER_USERNAME` from your `.env` file).
      required: [name]
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name of the service.
          ui:field: UniqueNamePicker
          ui:autofocus: true
        port:
          title: API Port
          type: number
          default: 8082
          ui:field: PortPicker
          description: Standardized platform networking port for web services.
        databaseConfig:
          title: Database Settings
          type: object
          ui:field: DatabasePicker


  steps:
    - id: fetch-source
      name: Fetch Source Content
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          port: ${{ parameters.port }}
          namespace: default
          owner: ${{ user.entity.metadata.name or 'guest' }}

    - id: publish-source
      name: Publish Source Repo
      action: publish:gitea
      input:
        description: Hasura Configuration for ${{ parameters.name }}
        # DYNAMIC ROUTING: Uses Git bridge variable
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    - id: create-webhook
      name: Create Gitea Webhook
      action: gitea:create-webhook
      input:
        # Match the dynamic Git routing
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-listener.default.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}-webhook-secret
        events:
          - push

    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          port: ${{ parameters.port }}
          namespace: default
          databaseName: ${{ parameters.databaseConfig.dbName }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          # DYNAMIC ROUTING: Uses Docker bridge variable
          
          dockerOrg: index.docker.io/${{ environment.parameters.dockerOrg }}
          repoName: ${{ parameters.name }}

          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        # Match the dynamic Git routing
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # --- THE APPLY-NAMESPACE STEP HAS BEEN COMPLETELY DELETED HERE ---

    - id: create-webhook-secret
      name: Create Kubernetes Webhook Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: default
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}-webhook-secret

    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    - id: register
      name: Register Component
      action: catalog:register
      if: '{{ parameters.registerToCatalog }}'
      input:
        repoContentsUrl: ${{ steps['publish-gitops'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    - id: notify
      name: Notify User
      action: notification:send
      if: '{{ parameters.sendNotification }}'
      input:
        recipients: entity
        entityRefs: ["user:default/guest"]
        title: 'Hasura Template Executed'
        info: 'Your Hasura instance is being deployed!'

  # Updated Output block to show both repositories
  output:
    links:
      - title: View Source Code Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: View GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}