apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hasura-graphql-template
  title: Hasura GraphQL API Template
  description: >-
    Scaffolds a Hasura GraphQL Engine instance connected to a
    dynamically provisioned PostgreSQL database.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      required: [name, port]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the Hasura instance
          ui:autofocus: true
        port:
          title: Port
          type: number
          description: The port Hasura listens on (default is 8080)
          default: 8080

    - title: Database Configuration
      properties:
        databaseConfig:
          title: Database Settings
          type: object
          ui:field: DatabasePicker

    - title: GitOps Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: GitOps Repository Location
          type: string
          description: Where to store the Kubernetes manifests
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [localhost:3030]

    - title: Optional Extras
      properties:
        registerToCatalog:
          title: Register component in catalog
          type: boolean
          default: true
        sendNotification:
          title: Send Backstage notification
          type: boolean
          default: false

  steps:
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          port: ${{ parameters.port }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          # Networking Fix: Use shorter DNS name
          gitopsRepo: http://gitea-http.gitea:3000/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}.git

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./gitops
        repoVisibility: public

    # Workflow Fix: Create the secret so the Operator has permission to clone the repo
    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: default
        username: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
        webhookSecret: gitea-webhook-secret

    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    - id: register
      name: Register Component
      action: catalog:register
      if: '{{ parameters.registerToCatalog }}'
      input:
        # Use the URL from the publish step (usually localhost:3030)
        # The Portal can reach this more reliably than the internal DNS.
        repoContentsUrl: ${{ steps['publish-gitops'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    - id: notify
      name: Notify User
      action: notification:send
      if: '{{ parameters.sendNotification }}'
      input:
        recipients: entity
        entityRefs: ["user:default/guest"]
        title: 'Hasura Template Executed'
        info: 'Your Hasura instance is being deployed!'

  output:
    links:
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}