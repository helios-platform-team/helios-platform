apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hasura-graphql-template
  title: Hasura GraphQL API Template
  description: >-
    Scaffolds a Hasura GraphQL Engine instance connected to a
    dynamically provisioned PostgreSQL database.
    The Helios Operator automatically injects the connection string (PGRST_DB_URI).
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      required: [name, port, dockerOrg, repoName]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the Hasura instance
          ui:autofocus: true
        port:
          title: Port
          type: number
          description: The port Hasura listens on (default is 8080)
          default: 8080
        dockerOrg:
          title: Docker Registry Org/User
          type: string
          description: Your Docker Hub username or Organization
        repoName:
          title: Docker Repository Name
          type: string
          description: The name of the Docker repository (e.g. my-hasura)

    - title: Database Configuration
      properties:
        databaseConfig:
          title: Database Settings
          type: object
          ui:field: DatabasePicker

    - title: GitOps & Deployment
      required: [repoUrl]
      properties:
        repoUrl:
          title: GitOps Repository Location
          type: string
          description: Where to store the Kubernetes manifests
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [localhost:3030]
        namespace:
          title: Kubernetes Namespace
          type: string
          description: Namespace where the service will be deployed
          default: default

    - title: Optional Extras
      properties:
        registerToCatalog:
          title: Register component in catalog
          type: boolean
          default: true
        sendNotification:
          title: Send Backstage notification
          type: boolean
          default: false

  steps:
    # 1. Fetch minimal source content (for consistency with PostgREST)
    - id: fetch-source
      name: Fetch Source Content
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}

    # 2. Publish source repo (this gives us real Git URLs)
    - id: publish-source
      name: Publish Source Repo
      action: publish:gitea
      input:
        description: Hasura Configuration for ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./source
        repoVisibility: public

    # 3. Create the Webhook
    - id: create-webhook
      name: Create Gitea Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ parameters.repoUrl }}
        # FIX: Replaced 'default' with dynamic namespace variable
        webhookUrl: http://el-${{ parameters.name }}-listener.${{ parameters.namespace }}.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}-webhook-secret
        events:
          - push

    # 4. Fetch GitOps Manifests
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          port: ${{ parameters.port }}
          # FIX: Passed namespace into the gitops templates
          namespace: ${{ parameters.namespace }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          image: index.docker.io/${{ parameters.dockerOrg }}/${{ parameters.repoName }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # FIX: Added Namespace Creation Step
    - id: apply-namespace
      name: Create Kubernetes Namespace
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/namespace.yaml

    # 5. Create webhook secret in cluster
    - id: create-webhook-secret
      name: Create Kubernetes Webhook Secret
      action: kubernetes:create-secret
      input:
        # FIX: Replaced 'default' with dynamic namespace variable
        namespace: ${{ parameters.namespace }}
        secretName: ${{ parameters.name }}-webhook-secret
        data:
          secret: ${{ parameters.name }}-webhook-secret

    # 6. Deploy HeliosApp
    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    # 7. Registration
    - id: register
      name: Register Component
      action: catalog:register
      if: '{{ parameters.registerToCatalog }}'
      input:
        repoContentsUrl: ${{ steps['publish-gitops'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    - id: notify
      name: Notify User
      action: notification:send
      if: '{{ parameters.sendNotification }}'
      input:
        recipients: entity
        entityRefs: ["user:default/guest"]
        title: 'Hasura Template Executed'
        info: 'Your Hasura instance is being deployed!'

  output:
    links:
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}