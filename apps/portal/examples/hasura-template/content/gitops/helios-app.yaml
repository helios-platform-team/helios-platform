apiVersion: app.helios.io/v1alpha1
kind: HeliosApp
metadata:
  name: ${{ values.name }}
  namespace: default
spec:
  owner: ${{ values.owner }}
  # Source repo for any custom code (though Hasura uses pre-built image)
  gitRepo: ${{ values.sourceRepo }}
  gitBranch: main
  # Pre-built Hasura image from Docker Hub
  imageRepo: hasura/graphql-engine
  # Separate GitOps repo for Kubernetes manifests
  gitopsRepo: ${{ values.gitopsRepo }}
  gitopsPath: ""
  
  # Webhook configuration (matches secret name from template.yaml)
  webhookSecret: ${{ values.name }}-webhook-secret
  triggerType: gitea-push
  
  components:
    - name: ${{ values.name }}
      type: web-service
      properties:
        image: hasura/graphql-engine:v2.33.0
        port: ${{ values.port }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "200m"
        env:
          - name: HASURA_GRAPHQL_DATABASE_URL
            value: "postgres://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/${{ values.databaseName | default(values.name) | replace('-', '_') }}"
      traits:
        - type: database
          properties:
            dbType: ${{ values.databaseType | default("postgres") }}
            dbName: ${{ values.databaseName | default(values.name) | replace('-', '_') }}
            version: "16"
            storage: "1Gi"