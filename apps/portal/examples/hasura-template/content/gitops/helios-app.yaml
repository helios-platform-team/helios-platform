apiVersion: app.helios.io/v1alpha1
kind: HeliosApp
metadata:
  name: ${{ values.name }}
  namespace: default
spec:
  owner: ${{ values.owner }}
  gitRepo: ${{ values.sourceRepo }}
  gitBranch: main
  
  # FIX: Tell Tekton where to push the newly built custom image
  imageRepo: ${{ values.image }}
  
  gitopsRepo: ${{ values.gitopsRepo }}
  gitopsPath: ""
  gitopsBranch: main
  
  webhookSecret: ${{ values.name }}-webhook-secret
  triggerType: gitea-push
  
  # FIX: Removed pipelineName: "" to re-enable the build pipeline!
  
  components:
    - name: ${{ values.name }}
      type: web-service
      properties:
        # FIX: Point the deployment to your newly built custom image
        image: ${{ values.image }}:latest
        port: ${{ values.port }}
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "200m"
        env:
          - name: HASURA_GRAPHQL_DATABASE_URL
            value: "postgres://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/${{ values.databaseName | default(values.name) | replace('-', '_') }}"
          - name: HASURA_GRAPHQL_ENABLE_CONSOLE
            value: "true"
      traits:
        - type: database
          properties:
            dbType: ${{ values.databaseType | default("postgres") }}
            dbName: ${{ values.databaseName | default(values.name) | replace('-', '_') }}
            version: "16"
            storage: "1Gi"