apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: postgrest-template
  title: PostgREST API Template
  description: Expose a fully-featured, instant RESTful API directly from any PostgreSQL database schema using PostgREST.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      description: >-
        We automatically configure your Git repository and Docker image locations using your local `.env` settings (`GITEA_USER` and `DOCKER_USERNAME`). No manual routing setup is required!
      required:
        - name
        - port
      properties:
        name:
          title: Service Name
          type: string
          description: The unique name for your project. This will be used to name your PostgREST service, code repository, and container image.
          ui:field: UniqueNamePicker
          ui:autofocus: true
        port:
          title: API Port
          type: number
          ui:field: PortPicker
          description: The network port your PostgREST API will serve traffic on.
          default: 3003
        databaseConfig:
          title: Database Settings
          type: object
          description: Choose a database configuration here to automatically generate a REST API from its schema.
          ui:field: DatabasePicker

    - title: PostgREST Configuration
      properties:
        apiSchema:
          title: API Schema
          type: string
          description: The specific PostgreSQL schema to expose as a REST API (e.g., 'public' or 'api').
          default: public
        jwtSecret:
          title: JWT Secret
          type: string
          description: A secure secret string used for signing JSON Web Tokens (JWT). It must be at least 32 characters long.
          minLength: 32
          maxLength: 64
          ui:field: Secret
        jwtRole:
          title: JWT Role
          type: string
          description: The default database role assigned to authenticated users providing a valid JWT.
          default: authenticated
        anonRole:
          title: Anonymous Role
          type: string
          description: The default database role for unauthenticated (anonymous) requests. Leave empty to disable public access.
          default: anon

    - title: Deployment Configuration
      properties:
        namespace:
          title: Kubernetes Namespace
          type: string
          description: The Kubernetes namespace where this service will be deployed.
          default: default


  steps:
    # 1. Source Code (config files + Dockerfile)
    - id: fetch-source
      name: Fetch Source Code
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.port }}
          description: "PostgREST API: ${{ parameters.name }}"
          # DYNAMIC ROUTING: Uses Docker bridge variable
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          apiSchema: ${{ parameters.apiSchema }}
          jwtSecret: ${{ secrets.jwtSecret }}
          jwtRole: ${{ parameters.jwtRole }}
          anonRole: ${{ parameters.anonRole }}

    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: PostgREST Configuration for ${{ parameters.name }}
        # DYNAMIC ROUTING: Uses Git bridge variable
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    - id: create-webhook
      name: Create Webhook for DB Migration Trigger
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-db-migrate-listener.default.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}
        events:
          - push

    # 2. GitOps
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          # DYNAMIC ROUTING
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          port: ${{ parameters.port }}
          namespace: default
          databaseType: ${{ parameters.databaseConfig.dbType }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          databaseVersion: ${{ parameters.databaseConfig.version or '18.4' }}
          apiSchema: ${{ parameters.apiSchema }}
          jwtSecret: ${{ secrets.jwtSecret }}
          jwtRole: ${{ parameters.jwtRole }}
          anonRole: ${{ parameters.anonRole }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          # Migration image configuration for PreSync Job
          migrateImage: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}-migrate:latest

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        # DYNAMIC ROUTING
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # 3. Apply namespace to cluster (INTENTIONALLY LEFT FOR YOUR FRIEND)
    - id: apply-namespace
      name: Create Kubernetes Namespace
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/namespace.yaml

    # 3.1 Apply service account
    - id: apply-rbac
      name: Apply RBAC for Migration
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/serviceaccount.yaml


    # 4. Create webhook secret in cluster
    - id: create-webhook-secret
      name: Create Kubernetes Webhook Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: default
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}

    # 5. Deploy HeliosApp to cluster
    - id: apply-heliosapp
      name: Apply HeliosApp to Cluster
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml

    # 6. Registration
    - id: register
      name: Register Component
      action: catalog:register
      if: '{{ parameters.registerToCatalog }}'
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    - id: notify
      name: Notify User
      action: notification:send
      if: '{{ parameters.sendNotification }}'
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: 'PostgREST API Template Executed'
        info: 'Your PostgREST instant REST API has been scaffolded with automatic CRUD endpoints!'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}