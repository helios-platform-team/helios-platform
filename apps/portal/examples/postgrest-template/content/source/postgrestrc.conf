# PostgREST Configuration File
# The PGRST_DB_URI is injected by the Helios Operator as an environment variable

# Database connection string (injected via PGRST_DB_URI env var)
# db-uri = "postgres://user:pass@localhost/dbname"

# Port on which to serve HTTP requests
server-port = ${{ values.port }}

# PostgreSQL schema to expose to clients
db-schema = "${{ values.apiSchema }}"

# Role to use for unauthenticated requests
# Omit or set to empty string to disallow anonymous access
db-anon-role = "${{ values.anonRole }}"

# JWT Configuration (optional, for authenticated requests)
# Role to use for authenticated requests
jwt-aud = "${{ values.jwtRole }}"

# This key will be used to verify JWTs; it can be a symmetric key or asymmetric public key
# For now, we disable JWT verification; clients can enable it by providing the secret
# jwt-secret = "your-secret-here"

# Request settings
max-rows = 1000

# Logging
log-level = "info"

# Connection pool settings (optional)
db-pool = 10
db-pool-timeout = 10
