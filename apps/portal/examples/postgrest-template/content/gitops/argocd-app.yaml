apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-argocd
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: ${{ values.gitopsRepo }}
    targetRevision: main
    path: ./
    
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
