---
# ServiceAccount for Tekton EventListener
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-${{ values.name }}
  namespace: ${{ values.namespace }}

---
# Role for triggering PipelineRuns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-trigger-role-${{ values.name }}
  namespace: ${{ values.namespace }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-trigger-binding-${{ values.name }}
  namespace: ${{ values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-trigger-role-${{ values.name }}
subjects:
  - kind: ServiceAccount
    name: tekton-${{ values.name }}
    namespace: ${{ values.namespace }}

---
# TriggerBinding
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: ${{ values.name }}-trigger-binding
  namespace: ${{ values.namespace }}
spec:
  params:
    - name: git-commit-sha
      value: $(body.after)
    - name: git-commit-message
      value: $(body.head_commit.message)
    - name: git-repository-url
      value: $(body.repository.clone_url)
    - name: git-branch
      value: $(body.ref)

---
# TriggerTemplate
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: ${{ values.name }}-trigger-template
  namespace: ${{ values.namespace }}
spec:
  params:
    - name: git-repository-url
      description: repository url
    - name: git-branch
      description: branch ref
    - name: git-commit-sha
      description: commit sha
    - name: git-commit-message
      description: commit message
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        name: ${{ values.name }}-pipeline-run
        namespace: ${{ values.namespace }}
      spec:
        pipelineRef:
          name: kaniko-build-push-pipeline
        params:
          - name: image-name
            value: ${{ values.image }}
          - name: image-tag
            value: $(tt.params.git-commit-sha)
          - name: dockerfile
            value: ./Dockerfile
          - name: build-context
            value: ./
          - name: git-repository-url
            value: $(tt.params.git-repository-url)
          - name: git-revision
            value: $(tt.params.git-branch)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
        taskRunTemplate:
          serviceAccountName: tekton-builder

---
# EventListener
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: el-${{ values.name }}-listener
  namespace: ${{ values.namespace }}
spec:
  serviceAccountName: tekton-${{ values.name }}
  triggers:
    - name: ${{ values.name }}-push-trigger
      bindings:
        - ref: ${{ values.name }}-trigger-binding
      template:
        ref: ${{ values.name }}-trigger-template

---
# Service to expose EventListener
apiVersion: v1
kind: Service
metadata:
  name: el-${{ values.name }}-listener
  namespace: ${{ values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/managed-by: EventListener
    eventlistener: el-${{ values.name }}-listener
  ports:
    - name: http-listener
      port: 8080
      targetPort: 8080
