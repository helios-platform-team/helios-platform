apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: react-template
  title: React Template
  description: Bootstrap a customizable React application (Vite/Webpack, Tailwind/CSS, Zustand/Redux, React Query). Supports connecting to a new template backend or linking to an existing one.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      description: >-
        To satisfy dynamic portability, this template automatically maps repository and image registry destinations
        using your active workstation configuration (`GITEA_USER` and `DOCKER_USERNAME` from your `.env` file).
      required: [name, buildTool, styling, stateManagement, dataFetching]
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name of the service.
          ui:field: UniqueNamePicker
          ui:autofocus: true
        port:
          title: Web Port
          type: number
          default: 5173
          ui:field: PortPicker
          description: Standardized platform networking port for web services.
        buildTool:
          title: Build Tool
          type: string
          description: Select the build tool and bundler
          enum:
            - vite
            - webpack
          enumNames:
            - Vite
            - Webpack
          default: vite
        styling:
          title: Styling
          type: string
          description: Choose the styling method
          enum:
            - tailwind
            - vanilla
          enumNames:
            - Tailwind CSS
            - Vanilla CSS
          default: tailwind
        stateManagement:
          title: State Management
          type: string
          description: Choose a state management library
          enum:
            - none
            - zustand
            - redux
          enumNames:
            - None
            - Zustand
            - Redux (Toolkit)
          default: none
        dataFetching:
          title: Data Fetching
          type: string
          description: Choose a data fetching library
          enum:
            - none
            - react-query
          enumNames:
            - None (Standard fetch)
            - React Query (TanStack Query)
          default: none
        backendConfig:
          title: Backend Configuration
          type: object
          ui:field: BackendComponentPicker

  steps:
    # 1. Fetch Source Code Template
    - id: fetch-source
      name: Fetch Source Code Template
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          repoName: ${{ parameters.name }}
          description: "React application: ${{ parameters.name }}"
          buildTool: ${{ parameters.buildTool }}
          styling: ${{ parameters.styling }}
          stateManagement: ${{ parameters.stateManagement }}
          dataFetching: ${{ parameters.dataFetching }}
          port: ${{ parameters.port }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          backendComponent: ${{ parameters.backendConfig.backendComponent if parameters.backendConfig else '' }}
          backendPort: ${{ parameters.backendConfig.backendPort if parameters.backendConfig else 3001 }}
          hasBackend: ${{ parameters.backendConfig and parameters.backendConfig.connectionType and parameters.backendConfig.connectionType != 'None' }}

    # 2. Configure Selected Stack
    - id: configure-files
      name: Configure Selected Stack
      action: fs:rename
      input:
        files: '${{ [ { from: "./source/index." + parameters.buildTool + ".html", to: "./source/index.html" }, { from: "./source/src/index." + parameters.styling + ".css", to: "./source/src/index.css" } ].concat( [ { from: "./source/src/store/reduxStore.js", to: "./source/src/store/store.js" } ] if parameters.stateManagement == "redux" else ( [ { from: "./source/src/store/zustandStore.js", to: "./source/src/store/store.js" } ] if parameters.stateManagement == "zustand" else [] ) ).concat( [ { from: "./source/webpack.config.ejs", to: "./source/webpack.config.js" } ] if parameters.buildTool == "webpack" else [] ) }}'

    # 3. Clean up Unused Files
    - id: cleanup-files
      name: Clean up Unused Files
      action: fs:delete
      input:
        files: '${{ ( [ "./source/index.webpack.html", "./source/webpack.config.ejs", "./source/babel.config.json" ] if parameters.buildTool == "vite" else [ "./source/index.vite.html", "./source/vite.config.js" ] ).concat( [ "./source/tailwind.config.cjs", "./source/postcss.config.cjs" ] if parameters.styling == "vanilla" else [] ).concat( [ "./source/src/store/zustandStore.js" ] if parameters.stateManagement == "redux" else ( [ "./source/src/store/reduxStore.js" ] if parameters.stateManagement == "zustand" else [ "./source/src/store" ] ) ).concat( [ "./source/src/index.vanilla.css" ] if parameters.styling == "tailwind" else [ "./source/src/index.tailwind.css" ] ) }}'

    # 4. Publish Source Code to Gitea
    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: Source Code for ${{ parameters.name }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    # 5. Create Gitea Webhook for Tekton CI
    - id: create-webhook
      name: Create Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-listener.default.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}
        events:
          - push

    # 6. Fetch GitOps Manifests Template
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          repoName: ${{ parameters.name }}
          namespace: default
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          port: ${{ parameters.port }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: "npm install && npm run build"
          backendComponent: ${{ parameters.backendConfig.backendComponent if parameters.backendConfig else '' }}
          backendPort: ${{ parameters.backendConfig.backendPort if parameters.backendConfig else 3001 }}

    # 7. Publish GitOps Manifests to Gitea
    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # 8. Create Git Credentials Secret on Kubernetes
    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: default
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}

    # 9. Deploy HeliosApp to Kubernetes
    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    # 10. Register Component in Catalog
    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: "catalog-info.yaml"

    # 11. Fetch Backend Source Code
    - id: fetch-backend-source
      name: Fetch Backend Source Code
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: fetch:local-template
      input:
        templateName: ${{ parameters.backendConfig.backendType + "-template" }}
        subDir: source
        targetPath: ./backend-source
        values:
          name: ${{ parameters.backendConfig.backendComponent }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.backendConfig.backendPort }}
          description: "Backend service for ${{ parameters.name }}"
          image: ${{ "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendConfig.backendComponent }}
          hasDatabase: ${{ parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' }}
          repoName: ${{ parameters.backendConfig.backendComponent }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          databaseConfig: ${{ parameters.backendConfig.backendDatabaseConfig }}
          apiSchema: "public"
          jwtSecret: "default_secret_key_32_characters_long"
          jwtRole: "authenticated"
          anonRole: "anon"

    # 12. Fetch Backend Database Source Files (NestJS & Node.js)
    - id: fetch-backend-source-db
      name: Fetch Backend Database Source Files
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' and (parameters.backendConfig.backendType == 'nestjs' or parameters.backendConfig.backendType == 'nodejs') and parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' }}
      action: fetch:local-template
      input:
        templateName: ${{ parameters.backendConfig.backendType + "-template" }}
        subDir: source-db
        targetPath: ./backend-source
        values:
          name: ${{ parameters.backendConfig.backendComponent }}
          hasDatabase: true

    # 13. Publish Backend Source Code to Gitea
    - id: publish-backend-source
      name: Publish Backend Source Code
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: publish:gitea
      input:
        description: Backend Source Code for ${{ parameters.backendConfig.backendComponent }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendConfig.backendComponent }}
        sourcePath: ./backend-source
        repoVisibility: public

    # 14. Create Gitea Webhook for Backend
    - id: create-backend-webhook
      name: Create Backend Webhook
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendConfig.backendComponent }}
        webhookUrl: http://el-${{ parameters.backendConfig.backendComponent }}-listener.default.svc.cluster.local:8080
        webhookSecret: ${{ parameters.backendConfig.backendComponent }}
        events:
          - push

      # 15. Fetch Backend GitOps Manifests
    - id: fetch-backend-gitops
      name: Fetch Backend GitOps Manifests
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: fetch:local-template
      input:
        templateName: ${{ parameters.backendConfig.backendType + "-template" }}
        subDir: gitops
        targetPath: ./backend-gitops
        values:
          name: ${{ parameters.backendConfig.backendComponent }}
          image: ${{ "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendConfig.backendComponent }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          repoName: ${{ parameters.backendConfig.backendComponent }}
          port: ${{ parameters.backendConfig.backendPort }}
          hasDatabase: ${{ parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' }}
          databaseType: ${{ parameters.backendConfig.backendDatabaseConfig.dbType if parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' else '' }}
          databaseName: ${{ parameters.backendConfig.backendDatabaseConfig.dbName if parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' else '' }}
          databaseVersion: ${{ parameters.backendConfig.backendDatabaseConfig.dbVersion if parameters.backendConfig.backendDatabaseConfig.dbType == 'postgres' else '' }}
          dbType: ${{ parameters.backendConfig.backendDatabaseConfig.dbType }}
          dbName: ${{ parameters.backendConfig.backendDatabaseConfig.dbName }}
          dbVersion: ${{ parameters.backendConfig.backendDatabaseConfig.dbVersion }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-backend-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-backend-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: ${{ "npm test" if parameters.backendConfig.backendType == 'nestjs' else ("npm install && npm test" if parameters.backendConfig.backendType == 'nodejs' else ("dotnet test" if parameters.backendConfig.backendType == 'dotnet' else ("gradle test" if parameters.backendConfig.backendType == 'spring-boot' else ""))) }}
          testImage: ${{ "mcr.microsoft.com/dotnet/sdk:10.0.300" if parameters.backendConfig.backendType == 'dotnet' else ("gradle:8.7-jdk21" if parameters.backendConfig.backendType == 'spring-boot' else "node:24") }}
          apiSchema: "public"
          jwtSecret: "default_secret_key_32_characters_long"
          jwtRole: "authenticated"
          anonRole: "anon"
          migrateImage: ${{ "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendConfig.backendComponent + "-migrate:latest" }}
          namespace: default

    # 16. Publish Backend GitOps Manifests to Gitea
    - id: publish-backend-gitops
      name: Publish Backend GitOps Manifests
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: publish:gitea
      input:
        description: Backend GitOps Manifests for ${{ parameters.backendConfig.backendComponent }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendConfig.backendComponent }}-gitops
        sourcePath: ./backend-gitops
        repoVisibility: public

    # 17. Create Backend Git Credentials Secret on Kubernetes
    - id: create-backend-secret
      name: Create Backend Git Credentials Secret
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.backendConfig.backendComponent }}
        namespace: default
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.backendConfig.backendComponent }}

    # 18. Deploy Backend to Kubernetes
    - id: apply-backend-helios
      name: Deploy Backend to Kubernetes
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: kubernetes:apply
      input:
        manifestPath: ./backend-gitops/helios-app.yaml
        namespaced: true

    # 19. Register Backend Component in Catalog
    - id: register-backend
      name: Register Backend Component
      if: ${{ parameters.backendConfig and parameters.backendConfig.connectionType == 'New' }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-backend-source'].output.repoContentsUrl }}
        catalogInfoPath: "catalog-info.yaml"

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
