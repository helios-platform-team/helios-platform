apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: ${{ values.repoName }}-git-binding
spec:
  params:
    - name: git-repo-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.head_commit.id)
    - name: git-repo-name
      value: $(body.repository.name)
    - name: git-owner
      value: $(body.repository.owner.login)

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: ${{ values.repoName }}-git-template
spec:
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ${{ values.repoName }}-run-
        labels:
          tekton.dev/pipeline: from-code-to-cluster
          app.kubernetes.io/instance: ${{ values.repoName }}
      spec:
        serviceAccountName: pipeline
        pipelineRef:
          name: from-code-to-cluster
        params:
          - name: app-repo-url
            value: $(tt.params.git-repo-url)
          - name: app-repo-revision
            value: $(tt.params.git-revision)
          - name: image-repo
            value: "${{ values.image }}" 
          - name: GITOPS_REPO_URL
            value: "${{ values.gitopsRepo }}"
          - name: GITOPS_REPO_BRANCH
            value: "main"
          - name: MANIFEST_PATH
            value: "helios-app.yaml"
          - name: docker-secret
            value: "docker-credentials"
          - name: test-command
            value: "${{ values.testCommand }}"
          - name: argocd-namespace
            value: "argocd"
          - name: argocd-app-name
            value: "${{ values.repoName }}-argocd"
        workspaces:
          - name: source-workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi

---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: ${{ values.repoName }}-listener
spec:
  serviceAccountName: ${{ values.repoName }}-sa
  triggers:
    - binding:
        name: ${{ values.repoName }}-git-binding
      template:
        name: ${{ values.repoName }}-git-template

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.repoName }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ values.repoName }}-listener-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: ${{ values.repoName }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${{ values.repoName }}-listener-clusterbinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: ${{ values.repoName }}-sa
    namespace: default
