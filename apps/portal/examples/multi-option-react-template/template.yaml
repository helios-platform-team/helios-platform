apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: multi-option-react-template
  title: Multi-Option React Scaffolder Template
  description: A flexible React template that lets you customize your build tool (Vite/Webpack), styling (Tailwind CSS), state management (Zustand/Redux), and data fetching (React Query), and deploys it automatically.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      required: [name]
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name of the service.
          ui:autofocus: true
        port:
          title: Web Port
          type: number
          default: 8080
          ui:readonly: true
          description: Standardized platform networking port for web services.
        namespace:
          title: Kubernetes Namespace
          type: string
          default: default
        backendComponent:
          title: Backend Component
          type: string
          description: Select the backend component to connect to (optional)
          ui:field: BackendComponentPicker
          ui:options:
            allowCustom: false

    - title: Automated Platform Routing
      description: >-
        To satisfy dynamic portability, this template automatically maps repository and image registry destinations
        using your active workstation configuration (`GITEA_USER` and `DOCKER_USERNAME` from your `.env` file).
      properties: {}

    - title: Tech Stack Options
      required:
        - buildTool
        - styling
        - stateManagement
        - dataFetching
      properties:
        buildTool:
          title: Build Tool
          type: string
          description: Select the build tool and bundler
          enum:
            - vite
            - webpack
          enumNames:
            - Vite
            - Webpack
          default: vite
        styling:
          title: Styling
          type: string
          description: Choose the styling method
          enum:
            - tailwind
            - vanilla
          enumNames:
            - Tailwind CSS
            - Vanilla CSS
          default: tailwind
        stateManagement:
          title: State Management
          type: string
          description: Choose a state management library
          enum:
            - none
            - zustand
            - redux
          enumNames:
            - None
            - Zustand
            - Redux (Toolkit)
          default: none
        dataFetching:
          title: Data Fetching
          type: string
          description: Choose a data fetching library
          enum:
            - none
            - react-query
          enumNames:
            - None (Standard fetch)
            - React Query (TanStack Query)
          default: none

    - title: Backend Component Details
      if:
        properties:
          backendComponent:
            type: string
            minLength: 1
      then:
        required:
          - backendType
          - backendPort
          - backendRepoName
        properties:
          backendType:
            title: Backend Type
            type: string
            enum:
              - nestjs-prisma
              - nodejs
              - dotnet
              - spring-boot
              - postgrest
              - hasura
              - postgraphile
            enumNames:
              - NestJS + Prisma (Optional Database)
              - Node.js Service
              - .NET Web API
              - Spring Boot
              - PostgREST (Instant REST API)
              - Hasura GraphQL Engine
              - PostGraphile (Instant GraphQL API)
            default: nestjs-prisma
          backendPort:
            title: Backend Port
            type: number
            default: 3001
          backendRepoName:
            title: Backend Docker Repository Name
            type: string
            description: The name of the repository (e.g. nestjs-prisma-backend)
          backendDatabaseConfig:
            title: Backend Database Settings
            type: object
            ui:field: DatabasePicker

  steps:
    # 1. Fetch Source Code Template
    - id: fetch-source
      name: Fetch Source Code Template
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          # Mapped repoName to name to preserve skeleton compatibility
          repoName: ${{ parameters.name }}
          description: "React application: ${{ parameters.name }}"
          buildTool: ${{ parameters.buildTool }}
          styling: ${{ parameters.styling }}
          stateManagement: ${{ parameters.stateManagement }}
          dataFetching: ${{ parameters.dataFetching }}
          port: ${{ parameters.port }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          # DYNAMIC ROUTING
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          backendComponent: ${{ parameters.backendComponent }}
          backendPort: ${{ parameters.backendPort or 3001 }}

    # 2. Configure Selected Stack (Always run, dynamic list)
    - id: configure-files
      name: Configure Selected Stack
      action: fs:rename
      input:
        files: '${{ [ { from: "./source/index." + parameters.buildTool + ".html", to: "./source/index.html" }, { from: "./source/src/index." + parameters.styling + ".css", to: "./source/src/index.css" } ].concat( [ { from: "./source/src/store/reduxStore.js", to: "./source/src/store/store.js" } ] if parameters.stateManagement == "redux" else ( [ { from: "./source/src/store/zustandStore.js", to: "./source/src/store/store.js" } ] if parameters.stateManagement == "zustand" else [] ) ).concat( [ { from: "./source/webpack.config.ejs", to: "./source/webpack.config.js" } ] if parameters.buildTool == "webpack" else [] ) }}'

    # 3. Clean up Unused Files (Always run, dynamic list)
    - id: cleanup-files
      name: Clean up Unused Files
      action: fs:delete
      input:
        files: '${{ ( [ "./source/index.webpack.html", "./source/webpack.config.ejs", "./source/babel.config.json" ] if parameters.buildTool == "vite" else [ "./source/index.vite.html", "./source/vite.config.js" ] ).concat( [ "./source/tailwind.config.cjs", "./source/postcss.config.cjs" ] if parameters.styling == "vanilla" else [] ).concat( [ "./source/src/store/zustandStore.js" ] if parameters.stateManagement == "redux" else ( [ "./source/src/store/reduxStore.js" ] if parameters.stateManagement == "zustand" else [ "./source/src/store" ] ) ).concat( [ "./source/src/index.vanilla.css" ] if parameters.styling == "tailwind" else [ "./source/src/index.tailwind.css" ] ) }}'

    # 4. Publish Source Code to Gitea
    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: Source Code for ${{ parameters.name }}
        # DYNAMIC ROUTING
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    # 5. Create Gitea Webhook for Tekton CI
    - id: create-webhook
      name: Create Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-listener.${{ parameters.namespace }}.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}
        events:
          - push

    # 6. Fetch GitOps Manifests Template
    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          repoName: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          port: ${{ parameters.port }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: "npm install && npm run build"

    # 7. Publish GitOps Manifests to Gitea
    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    # 8. Create Git Credentials Secret on Kubernetes
    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: ${{ parameters.namespace }}
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}

    # 9. Deploy HeliosApp to Kubernetes
    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    # 10. Register Component in Catalog
    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

    # 11. Fetch Backend Source Code
    - id: fetch-backend-source
      name: Fetch Backend Source Code
      if: ${{ parameters.backendComponent }}
      action: fetch:local-template
      input:
        templateName: ${{ parameters.backendType + "-template" }}
        subDir: source
        targetPath: ./backend-source
        values:
          name: ${{ parameters.backendComponent }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.backendPort }}
          description: "Backend service for ${{ parameters.name }}"
          image: ${{ "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendRepoName }}
          hasDatabase: ${{ parameters.backendDatabaseConfig.dbType == 'postgres' }}
          repoName: ${{ parameters.backendRepoName }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          databaseConfig: ${{ parameters.backendDatabaseConfig }}
          apiSchema: "public"
          jwtSecret: "default_secret_key_32_characters_long"
          jwtRole: "authenticated"
          anonRole: "anon"

    # 12. Fetch Backend Database Source Files (NestJS only)
    - id: fetch-backend-source-db
      name: Fetch Backend Database Source Files
      if: ${{ parameters.backendComponent and parameters.backendType == 'nestjs-prisma' and parameters.backendDatabaseConfig.dbType == 'postgres' }}
      action: fetch:local-template
      input:
        templateName: nestjs-prisma-template
        subDir: source-db
        targetPath: ./backend-source
        values:
          name: ${{ parameters.backendComponent }}
          hasDatabase: true

    # 13. Publish Backend Source Code to Gitea
    - id: publish-backend-source
      name: Publish Backend Source Code
      if: ${{ parameters.backendComponent }}
      action: publish:gitea
      input:
        description: Backend Source Code for ${{ parameters.backendComponent }}
        # DYNAMIC ROUTING
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendRepoName }}
        sourcePath: ./backend-source
        repoVisibility: public

    # 14. Create Gitea Webhook for Backend
    - id: create-backend-webhook
      name: Create Backend Webhook
      if: ${{ parameters.backendComponent }}
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendRepoName }}
        webhookUrl: http://el-${{ parameters.backendComponent }}-listener.${{ parameters.namespace }}.svc.cluster.local:8080
        webhookSecret: ${{ parameters.backendComponent }}
        events:
          - push

    # 15. Fetch Backend GitOps Manifests
    - id: fetch-backend-gitops
      name: Fetch Backend GitOps Manifests
      if: ${{ parameters.backendComponent }}
      action: fetch:local-template
      input:
        templateName: ${{ parameters.backendType + "-template" }}
        subDir: gitops
        targetPath: ./backend-gitops
        values:
          name: ${{ parameters.backendComponent }}
          image: ${{ parameters.backendRepoName if (parameters.backendType == 'nestjs-prisma' or parameters.backendType == 'dotnet') else "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendRepoName }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          repoName: ${{ parameters.backendRepoName }}
          port: ${{ parameters.backendPort }}
          hasDatabase: ${{ parameters.backendDatabaseConfig.dbType == 'postgres' }}
          databaseType: ${{ parameters.backendDatabaseConfig.dbType if parameters.backendDatabaseConfig.dbType == 'postgres' else '' }}
          databaseName: ${{ parameters.backendDatabaseConfig.dbName if parameters.backendDatabaseConfig.dbType == 'postgres' else '' }}
          databaseVersion: ${{ parameters.backendDatabaseConfig.dbVersion if parameters.backendDatabaseConfig.dbType == 'postgres' else '' }}
          dbType: ${{ parameters.backendDatabaseConfig.dbType }}
          dbName: ${{ parameters.backendDatabaseConfig.dbName }}
          dbVersion: ${{ parameters.backendDatabaseConfig.dbVersion }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-backend-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-backend-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: ${{ "npm test" if parameters.backendType == 'nestjs-prisma' else ("npm install && npm test" if parameters.backendType == 'nodejs' else ("dotnet test" if parameters.backendType == 'dotnet' else ("gradle test" if parameters.backendType == 'spring-boot' else ""))) }}
          testImage: ${{ "mcr.microsoft.com/dotnet/sdk:10.0.300" if parameters.backendType == 'dotnet' else ("gradle:8.7-jdk21" if parameters.backendType == 'spring-boot' else "node:24") }}
          apiSchema: "public"
          jwtSecret: "default_secret_key_32_characters_long"
          jwtRole: "authenticated"
          anonRole: "anon"
          migrateImage: ${{ "index.docker.io/" + environment.parameters.dockerOrg + "/" + parameters.backendRepoName + "-migrate:latest" }}
          namespace: ${{ parameters.namespace }}

    # 16. Publish Backend GitOps Manifests to Gitea
    - id: publish-backend-gitops
      name: Publish Backend GitOps Manifests
      if: ${{ parameters.backendComponent }}
      action: publish:gitea
      input:
        description: Backend GitOps Manifests for ${{ parameters.backendComponent }}
        # DYNAMIC ROUTING
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.backendRepoName }}-gitops
        sourcePath: ./backend-gitops
        repoVisibility: public

    # 17. Create Backend Git Credentials Secret on Kubernetes
    - id: create-backend-secret
      name: Create Backend Git Credentials Secret
      if: ${{ parameters.backendComponent }}
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.backendComponent }}
        namespace: ${{ parameters.namespace }}
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.backendComponent }}

    # 18. Deploy Backend to Kubernetes
    - id: apply-backend-helios
      name: Deploy Backend to Kubernetes
      if: ${{ parameters.backendComponent }}
      action: kubernetes:apply
      input:
        manifestPath: ./backend-gitops/helios-app.yaml
        namespaced: true

    # 19. Register Backend Component in Catalog
    - id: register-backend
      name: Register Backend Component
      if: ${{ parameters.backendComponent }}
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-backend-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}