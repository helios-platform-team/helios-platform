apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}-migrator
  namespace: ${{ values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ values.name }}-migrator-role
  namespace: ${{ values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ values.name }}-migrator-rolebinding
  namespace: ${{ values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ values.name }}-migrator-role
subjects:
  - kind: ServiceAccount
    name: ${{ values.name }}-migrator
    namespace: ${{ values.namespace }}
