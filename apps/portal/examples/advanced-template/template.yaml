apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: advanced-nodejs-template
  title: Advanced Node.js Template (GitOps + Webhooks)
  description: Scaffolds a Node.js Service with Source Code, GitOps manifests (ArgoCD + Tekton), and Webhook configuration.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Component Information
      required: [name]
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name of the service.
          ui:autofocus: true
        port:
          title: API Port
          type: number
          default: 8080
          ui:readonly: true
          description: Standardized platform networking port for web services.
        namespace:
          title: Kubernetes Namespace
          type: string
          default: default

    - title: Automated Platform Routing
      description: >-
        To satisfy dynamic portability, this template automatically maps repository and image registry destinations
        using your active workstation configuration (`GITEA_USER` and `DOCKER_USERNAME` from your `.env` file).
      properties: {} 

    - title: Database Configuration
      properties:
        databaseConfig:
          title: Database Settings
          type: object
          ui:field: DatabasePicker

  steps:
    - id: fetch-source
      name: Fetch Source Code
      action: fetch:template
      input:
        url: ./content/source
        targetPath: ./source
        values:
          name: ${{ parameters.name }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          port: ${{ parameters.port }}
          description: "Service for ${{ parameters.name }}"
          # DYNAMIC ROUTING
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}

    - id: publish-source
      name: Publish Source Code
      action: publish:gitea
      input:
        description: Source Code for ${{ parameters.name }}
        # DYNAMIC ROUTING
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        sourcePath: ./source
        repoVisibility: public

    - id: create-webhook
      name: Create Webhook
      action: gitea:create-webhook
      input:
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}
        webhookUrl: http://el-${{ parameters.name }}-listener.${{ parameters.namespace }}.svc.cluster.local:8080
        webhookSecret: ${{ parameters.name }}
        events:
          - push

    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./content/gitops
        targetPath: ./gitops
        values:
          name: ${{ parameters.name }}
          image: index.docker.io/${{ environment.parameters.dockerOrg }}/${{ parameters.name }}
          dockerOrg: ${{ environment.parameters.dockerOrg }}
          repoName: ${{ parameters.name }}
          port: ${{ parameters.port }}
          databaseType: ${{ parameters.databaseConfig.dbType }}
          databaseName: ${{ parameters.databaseConfig.dbName }}
          owner: ${{ user.entity.metadata.name or 'guest' }}
          sourceRepo: ${{ steps['publish-source'].output.remoteUrl }}
          gitopsRepo: ${{ steps['publish-source'].output.remoteUrl | replace(".git", "") }}-gitops
          testCommand: "npm install && npm test"
          dbType: ${{ parameters.databaseConfig.dbType }}
          dbName: ${{ parameters.databaseConfig.dbName }}
          dbVersion: ${{ parameters.databaseConfig.dbVersion }}

    - id: publish-gitops
      name: Publish GitOps Manifests
      action: publish:gitea
      input:
        description: GitOps Manifests for ${{ parameters.name }}
        repoUrl: ${{ environment.parameters.gitHost }}?owner=${{ environment.parameters.gitOrg }}&repo=${{ parameters.name }}-gitops
        sourcePath: ./gitops
        repoVisibility: public

    - id: create-secret
      name: Create Git Credentials Secret
      action: kubernetes:create-git-credentials-secret
      input:
        name: ${{ parameters.name }}
        namespace: ${{ parameters.namespace }}
        username: ${{ environment.parameters.gitOrg }}
        webhookSecret: ${{ parameters.name }}

    - id: apply-helios
      name: Deploy to Kubernetes
      action: kubernetes:apply
      input:
        manifestPath: ./gitops/helios-app.yaml
        namespaced: true

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}