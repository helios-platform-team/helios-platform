apiVersion: app.helios.io/v1alpha1
kind: HeliosApp
metadata:
  name: ${{ values.name }}
  namespace: default
spec:
  owner: ${{ values.owner }}
  description: "NestJS service: ${{ values.name }}"
  gitRepo: ${{ values.sourceRepo }}
  gitBranch: main
  imageRepo: ${{ values.dockerOrg }}/${{ values.repoName }}
  gitopsRepo: ${{ values.gitopsRepo }}
  gitopsPath: ${{ values.name }}
  pipelineName: from-code-to-cluster
  webhookSecret: git-credentials-${{ values.name }}
  gitopsSecretRef: git-credentials-${{ values.name }}
  port: ${{ values.port }}
  # testCommand runs inside the pipeline's run-tests step.
  # The step itself handles node_modules caching (restore/save keyed by
  # package-lock.json hash), so we only need to invoke the test runner.
  testCommand: "npm test"
  testImage: "node:24"
  components:
    - name: ${{ values.name }}
      type: web-service
      properties:
        # Use :main so the tag matches what the initial pipeline push produces.
        # ArgoCD will self-heal once the build completes and pushes the :main image.
        image: ${{ values.dockerOrg }}/${{ values.repoName }}:main
        port: ${{ values.port }}
        replicas: 1
      traits:
        - type: service
          properties:
            port: ${{ values.port }}
        {% if values.databaseType == "postgres" %}
        - type: database
          properties:
            dbType: postgres
            dbName: ${{ values.databaseName | default(values.name | replace('-', '_') + "_db") }}
            version: ${{ values.databaseVersion | default("16") | dump }}
            storage: "1Gi"
        {% endif %}
