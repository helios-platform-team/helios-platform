# pipeline.yaml (Updated with separate workspaces)
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: from-code-to-cluster
spec:
  params:
    - name: app-repo-url
    - name: app-repo-revision
    - name: image-repo
    - name: gitops-repo-url
    - name: manifest-path
    - name: gitops-repo-branch
    - name: context-subpath
      default: "" # Empty means Dockerfile is at repo root
    - name: replicas
      default: "2"
    - name: port
      default: "8080"
    - name: docker-secret
      default: "docker-credentials"
    - name: test-command
      default: ""          # Empty => no tests (no-op)
    - name: test-image
      default: "node:24"   # Default image for tests; can be overridden per app
    - name: argocd-namespace
      default: "argocd"
    - name: argocd-app-name
    - name: env-vars
      default: "[]"
    - name: resources
      default: "{}"
    - name: gitops-secret-ref
      default: "helios-gitops-bot"
    - name: gitops-author-name
      default: "Helios Bot"
    - name: gitops-author-email
      default: "helios-bot@helios.local"

  workspaces:
    - name: source-workspace
    - name: gitops-workspace

  tasks:
    - name: fetch-source-code
      taskRef:
        name: git-clone
      workspaces:
        # CHANGE 2: Use the 'source-workspace' for app code
        - name: output
          workspace: source-workspace
      params:
        - name: url
          value: $(params.app-repo-url)
        - name: revision
          value: $(params.app-repo-revision)

    - name: run-tests
      runAfter: [fetch-source-code]
      workspaces:
        - name: source
          workspace: source-workspace
      params:
        - name: test-command
          value: $(params.test-command)
        - name: test-image
          value: $(params.test-image)
      taskSpec:
        params:
          - name: test-command
            type: string
            default: ""
          - name: test-image
            type: string
        workspaces:
          - name: source
        steps:
          - name: run-tests
            image: $(params.test-image)
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env sh
              set -e

              if [ -z "$(params.test-command)" ]; then
                echo "No test command provided; skipping tests."
                exit 0
              fi

              echo "Running tests with command: $(params.test-command)"
              sh -lc "$(params.test-command)"

    - name: build-and-push-image
      taskRef:
        name: buildah-build
      runAfter: [run-tests]
      workspaces:
        # CHANGE 3: The build task also uses 'source-workspace'
        - name: source
          workspace: source-workspace
      params:
        - name: image
          value: "$(params.image-repo):$(params.app-repo-revision)"
        - name: context-subpath
          value: "$(params.context-subpath)"
        - name: docker-secret
          value: "$(params.docker-secret)"

    - name: update-gitops-manifest
      taskRef:
        name: git-update-manifest
      runAfter: [build-and-push-image]
      workspaces:
        # CHANGE 4: This task gets its OWN clean 'gitops-workspace'
        - name: gitops-repo
          workspace: gitops-workspace
      params:
        - name: gitops-repo-url
          value: $(params.gitops-repo-url)
        - name: manifest-path
          value: $(params.manifest-path)
        - name: new-image-url
          value: $(tasks.build-and-push-image.results.IMAGE_URL)
        - name: gitops-repo-branch
          value: $(params.gitops-repo-branch)
        - name: gitops-secret-ref
          value: $(params.gitops-secret-ref)
        - name: gitops-author-name
          value: $(params.gitops-author-name)
        - name: gitops-author-email
          value: $(params.gitops-author-email)
        - name: replicas
          value: $(params.replicas)
        - name: port
          value: $(params.port)

    - name: argocd-sync
      taskRef:
        name: argocd-sync
      runAfter: [update-gitops-manifest]
      params:
        - name: argocd-namespace
          value: $(params.argocd-namespace)
        - name: argocd-app-name
          value: $(params.argocd-app-name)
